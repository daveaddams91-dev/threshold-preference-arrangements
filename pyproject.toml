[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tolprefs"
version = "1.0.0"
description = "Exact chamber counts for tolerance-based distance orderings of point sets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rajveersinh-is-dev" }]
keywords = [
    "arrangements",
    "hyperbola",
    "arrangements of curves",
    "exact arithmetic",
    "Sturm sequences",
    "discrete geometry",
    "preference rankings",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
experiments = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/rajveersinh-is-dev/threshold-preference-arrangements"
Repository = "https://github.com/rajveersinh-is-dev/threshold-preference-arrangements"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]